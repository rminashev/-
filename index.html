<style>
:root{--bg:#fff;--fg:#1d2433;--mut:#5f6b7a;--line:#d5dae1;--acc:#0b5fff}
@media (prefers-color-scheme:dark){:root{--bg:#161b24;--fg:#e8ecf2;--mut:#98a3b3;--line:#2c3544}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:14px/1.35 Arial,Helvetica,sans-serif;color:var(--fg);background:var(--bg)}
body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
#bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px;border-bottom:1px solid var(--line);align-items:center}
#bar select,#bar input,#bar button{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
#bar input{width:120px}
#stats{display:flex;flex-wrap:wrap;gap:10px;padding:6px 8px;border-bottom:1px solid var(--line);color:var(--mut);font-size:13px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
#map{flex:1;min-height:0}
#route{border-top:1px solid var(--line);padding:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));max-height:34vh;overflow:auto}
#route h3{margin:0 0 6px;font-size:14px}
#route ol{margin:0 0 8px;padding-left:20px}
#route li{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
#route .x{border:0;background:none;color:var(--mut);font-size:16px;cursor:pointer}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.btn,.btns button{display:inline-block;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);text-decoration:none;font:inherit;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.pop{min-width:210px;color:#1d2433}
.pop b{font-size:15px}.pop .m{color:#5f6b7a;margin:2px 0 6px}
.pop select{width:100%;margin:6px 0;padding:6px;font:inherit}
.pop .btn,.pop button{color:#1d2433;background:#fff;border-color:#c5ccd6}
.pop .btn.pri{background:#0b5fff;border-color:#0b5fff;color:#fff}
</style>
</head>

var KEY = "turk-statuses-v1", MAXPTS = 10;

var saved = {};
try { saved = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) {}
DATA.forEach(function (d) { if (saved[d[0]] && STATUS[saved[d[0]]]) d[3] = saved[d[0]]; });
function save() {
  var o = {}; DATA.forEach(function (d) { o[d[0]] = d[3]; });
  try { localStorage.setItem(KEY, JSON.stringify(o)); } catch (e) {}
}

var map = L.map("map", {preferCanvas: true}).setView([41.5, 68.5], 8);
var osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom: 19, attribution: "© OpenStreetMap"});
var sat = L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {maxZoom: 19, attribution: "Esri"});
osm.addTo(map);
L.control.layers({"Схема": osm, "Спутник": sat}).addTo(map);

var group = L.layerGroup().addTo(map);
var routeLine = L.polyline([], {color: "#0b5fff", weight: 3, dashArray: "6 6"}).addTo(map);
var route = [];
var markers = DATA.map(function (d, i) {
  var m = L.circleMarker([d[4], d[5]], {radius: 8, weight: 2, color: "#fff", fillOpacity: 0.95, fillColor: STATUS[d[3]] || "#777"});
  m.on("click", function () { openPopup(i); });
  return m;
});

function fill(sel, vals) {
  vals.forEach(function (v) { var o = document.createElement("option"); o.value = v; o.textContent = v; sel.appendChild(o); });
}
function uniq(k) { return DATA.map(function (d) { return d[k]; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).sort(); }
fill(fType, uniq(1)); fill(fDist, uniq(2)); fill(fStat, Object.keys(STATUS));

function visible(d) {
  return (!fType.value || d[1] === fType.value) && (!fDist.value || d[2] === fDist.value) &&
    (!fStat.value || d[3] === fStat.value) && (!fQ.value || d[0].toLowerCase().indexOf(fQ.value.toLowerCase()) >= 0);
}
function apply(fit) {
  group.clearLayers();
  var pts = [];
  DATA.forEach(function (d, i) { if (visible(d)) { group.addLayer(markers[i]); pts.push([d[4], d[5]]); } });
  if (fit && pts.length) map.fitBounds(pts, {padding: [30, 30], maxZoom: 15});
  stats();
}
function stats() {
  var c = {}, n = 0;
  DATA.forEach(function (d) { if (visible(d)) { c[d[3]] = (c[d[3]] || 0) + 1; n++; } });
  var h = "<span>Показано: <b>" + n + "</b></span>";
  Object.keys(STATUS).forEach(function (s) {
    if (c[s]) h += '<span><i class="dot" style="background:' + STATUS[s] + '"></i>' + s + ": " + c[s] + "</span>";
  });
  document.getElementById("stats").innerHTML = h;
}
[fType, fDist, fStat].forEach(function (e) { e.onchange = function () { apply(true); }; });
fQ.oninput = function () { apply(false); };

function naviLink(pts) {
  var q = [];
  pts.slice(0, -1).forEach(function (p, i) { q.push("lat_via_" + i + "=" + p[4], "lon_via_" + i + "=" + p[5]); });
  var l = pts[pts.length - 1];
  q.push("lat_to=" + l[4], "lon_to=" + l[5]);
  return "yandexnavi://build_route_on_map?" + q.join("&");
}
function mapsLink(pts) {
  return "https://yandex.ru/maps/?rtt=auto&rtext=~" + pts.map(function (p) { return p[4] + "," + p[5]; }).join("~");
}
function openPopup(i) {
  var d = DATA[i], el = document.createElement("div"); el.className = "pop";
  var inR = route.indexOf(i) >= 0;
  var t = document.createElement("b"); t.textContent = d[0]; el.appendChild(t);
  var m = document.createElement("div"); m.className = "m"; m.textContent = d[1] + " · " + d[2]; el.appendChild(m);
  var a = document.createElement("div"); a.textContent = d[6]; el.appendChild(a);
  var s = document.createElement("select");
  Object.keys(STATUS).forEach(function (k) { var o = document.createElement("option"); o.textContent = k; o.selected = k === d[3]; s.appendChild(o); });
  s.onchange = function () { d[3] = s.value; markers[i].setStyle({fillColor: STATUS[d[3]]}); save(); stats(); };
  el.appendChild(s);
  var b = document.createElement("div"); b.className = "btns";
  var n1 = document.createElement("a"); n1.className = "btn pri"; n1.textContent = "Навигатор"; n1.href = naviLink([d]); b.appendChild(n1);
  var n2 = document.createElement("a"); n2.className = "btn"; n2.textContent = "Карты"; n2.target = "_blank"; n2.rel = "noopener"; n2.href = mapsLink([d]); b.appendChild(n2);
  var r = document.createElement("button"); r.textContent = inR ? "Убрать из маршрута" : "В маршрут";
  r.onclick = function () { toggle(i); map.closePopup(); }; b.appendChild(r);
  el.appendChild(b);
  L.popup().setLatLng([d[4], d[5]]).setContent(el).openOn(map);
}

function toggle(i) {
  var k = route.indexOf(i);
  if (k >= 0) route.splice(k, 1); else route.push(i);
  drawRoute();
}
function drawRoute() {
  var pts = route.map(function (i) { return DATA[i]; });
  document.getElementById("route").hidden = !pts.length;
  rc.textContent = pts.length;
  rw.textContent = pts.length > MAXPTS ? "— больше " + MAXPTS + " точек, Навигатор может не принять" : "";
  rl.innerHTML = "";
  pts.forEach(function (d, k) {
    var li = document.createElement("li"), s = document.createElement("span");
    s.textContent = d[0] + " — " + d[2];
    var x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.setAttribute("aria-label", "Убрать " + d[0]);
    x.onclick = function () { route.splice(k, 1); drawRoute(); };
    li.appendChild(s); li.appendChild(x); rl.appendChild(li);
  });
  routeLine.setLatLngs(pts.map(function (d) { return [d[4], d[5]]; }));
  if (pts.length) { goNavi.href = naviLink(pts); goMaps.href = mapsLink(pts); }
}
sort.onclick = function () {
  if (route.length < 3) return;
  var left = route.slice(1), out = [route[0]];
  while (left.length) {
    var c = DATA[out[out.length - 1]], bi = 0, bd = 1e9;
    left.forEach(function (j, k) {
      var dd = Math.pow(DATA[j][4] - c[4], 2) + Math.pow((DATA[j][5] - c[5]) * 0.75, 2);
      if (dd < bd) { bd = dd; bi = k; }
    });
    out.push(left.splice(bi, 1)[0]);
  }
  route = out; drawRoute();
};
clr.onclick = function () { route = []; drawRoute(); };

exp.onclick = function () {
  var rows = [["Код", "Тип", "Район", "Статус", "Широта", "Долгота", "Адрес"]].concat(DATA);
  var csv = rows.map(function (r) { return r.map(function (v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(";"); }).join("\r\n");
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], {type: "text/csv;charset=utf-8"}));
  a.download = "objects_status.csv"; a.click();
};

apply(true);
